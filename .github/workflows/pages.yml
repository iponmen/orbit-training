name: Deploy Orbit Training

on:
  push:
    branches: [main]
    paths:
      - orbit-training-github-pages.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract the verified static build
        run: |
          unzip -q orbit-training-github-pages.zip -d dist
          test -f dist/index.html
          test -f dist/sleep-quest/index.html
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
